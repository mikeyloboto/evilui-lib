<div class="flex w-full flex-col">
  <div class="flex flex-row gap-1 px-3">
    @for (tab of getLeft(); track tab) {
      <div
        class="cursor-pointer"
        (click)="switchTab(tab)"
        [class]="getClasses(tab)"
        >
        {{ tab.title }}
      </div>
    }
    <div class="grow"></div>
    @for (tab of getRight(); track tab) {
      <div
        class="cursor-pointer"
        (click)="switchTab(tab)"
        [class]="getClasses(tab)"
        >
        {{ tab.title }}
      </div>
    }
  </div>
  <div
    class="rounded-xl p-2 shadow-inner shadow-neutral-950"
    [class]="getContainerClasses()"
    >
    <ng-content />
  </div>
</div>
